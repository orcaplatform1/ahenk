packages:
  - "apps/*"
  - "packages/*"
  - "backend"
allowBuilds:
  # Kurulum betikleri çalıştırılmaz (sunucuda da şimdiye kadar çalışmıyordu); EAS Build'de kurulum hatası vermemesi için açıkça false
  '@firebase/util': false
  '@nestjs/core': false
  '@prisma/client': false
  '@prisma/engines': false
  '@scarf/scarf': false
  msgpackr-extract: false
  prisma: false
  protobufjs: false
overrides:
  '@types/react': ^19.3.0
