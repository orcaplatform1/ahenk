<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="640" viewBox="0 0 1016 640" role="img" aria-labelledby="title desc">
  <title id="title">KYC Demo Identity Card — Back</title>
  <desc id="desc">Fictional, blank reverse-side identity card mockup for website KYC UI testing. Not an official document.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5f7"/>
      <stop offset=".52" stop-color="#e8eaf3"/>
      <stop offset="1" stop-color="#f1eef4"/>
    </linearGradient>
    <pattern id="fineLines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V12" stroke="#648a9d" stroke-width="1" opacity=".15"/>
    </pattern>
    <pattern id="rosettes" width="150" height="130" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8297aa" stroke-width="1.3" opacity=".2">
        <circle cx="75" cy="65" r="50"/><circle cx="75" cy="65" r="37"/>
        <ellipse cx="75" cy="65" rx="22" ry="50"/><ellipse cx="75" cy="65" rx="50" ry="22"/>
        <path d="M25 65Q75 0 125 65Q75 130 25 65Z"/>
      </g>
    </pattern>
  </defs>
  <rect x="8" y="8" width="1000" height="624" rx="32" fill="url(#card)" stroke="#9aa8b2" stroke-width="3"/>
  <rect x="20" y="20" width="976" height="600" rx="24" fill="url(#fineLines)"/>
  <rect x="20" y="20" width="976" height="600" rx="24" fill="url(#rosettes)"/>
  <rect x="26" y="26" width="964" height="588" rx="22" fill="none" stroke="#ffffff" stroke-width="2" opacity=".8"/>

  <text x="64" y="75" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#2c3b47">KYC DEMO CARD</text>
  <text x="64" y="103" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.6" fill="#536977">REVERSE SIDE • TEST TEMPLATE</text>

  <!-- Decorative fictional chip -->
  <rect x="95" y="190" width="150" height="118" rx="22" fill="#d9d5d4" stroke="#8997a1" stroke-width="2"/>
  <g fill="none" stroke="#8c969e" stroke-width="3">
    <path d="M122 190V218Q122 235 143 235H197Q218 235 218 218V190"/>
    <path d="M122 308V280Q122 263 143 263H197Q218 263 218 280V308"/>
    <path d="M95 220H132Q148 220 148 239V259Q148 278 132 278H95"/>
    <path d="M245 220H208Q192 220 192 239V259Q192 278 208 278H245"/>
    <path d="M148 220V278M192 220V278"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#30434f">
    <text x="300" y="180" font-size="15" fill="#607481">MOTHER'S NAME</text>
    <rect x="300" y="192" width="330" height="40" rx="6" fill="#ffffff" fill-opacity=".65" stroke="#8fa0ac" stroke-dasharray="5 4"/>
    <text x="315" y="218" font-size="18" fill="#84949e">[ blank ]</text>

    <text x="300" y="258" font-size="15" fill="#607481">FATHER'S NAME</text>
    <rect x="300" y="270" width="330" height="40" rx="6" fill="#ffffff" fill-opacity=".65" stroke="#8fa0ac" stroke-dasharray="5 4"/>
    <text x="315" y="296" font-size="18" fill="#84949e">[ blank ]</text>

    <text x="300" y="336" font-size="15" fill="#607481">ISSUING AUTHORITY</text>
    <rect x="300" y="348" width="330" height="40" rx="6" fill="#ffffff" fill-opacity=".65" stroke="#8fa0ac" stroke-dasharray="5 4"/>
    <text x="315" y="374" font-size="18" fill="#84949e">[ blank ]</text>
  </g>

  <!-- Decorative barcode; not encoded to a real identifier -->
  <g fill="#28333a" opacity=".88">
    <rect x="665" y="70" width="9" height="48"/><rect x="680" y="70" width="4" height="48"/>
    <rect x="690" y="70" width="11" height="48"/><rect x="707" y="70" width="5" height="48"/>
    <rect x="718" y="70" width="8" height="48"/><rect x="732" y="70" width="4" height="48"/>
    <rect x="742" y="70" width="12" height="48"/><rect x="760" y="70" width="5" height="48"/>
    <rect x="771" y="70" width="8" height="48"/><rect x="785" y="70" width="4" height="48"/>
    <rect x="795" y="70" width="11" height="48"/><rect x="812" y="70" width="5" height="48"/>
    <rect x="823" y="70" width="9" height="48"/><rect x="838" y="70" width="4" height="48"/>
    <rect x="848" y="70" width="12" height="48"/><rect x="866" y="70" width="5" height="48"/>
    <rect x="877" y="70" width="8" height="48"/><rect x="891" y="70" width="4" height="48"/>
  </g>
  <rect x="875" y="165" width="74" height="40" rx="5" fill="#355c48" opacity=".88"/>
  <circle cx="912" cy="185" r="12" fill="none" stroke="#d9d4a2" stroke-width="4"/>
  <text x="912" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5e707a">DECORATIVE MARK</text>

  <!-- Clearly fictional machine-readable placeholder -->
  <rect x="42" y="430" width="932" height="142" rx="12" fill="#fbfbfa" fill-opacity=".86" stroke="#b4bec5" stroke-width="1.5"/>
  <text x="62" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2" fill="#6c7d87">MACHINE-READABLE AREA — PLACEHOLDER ONLY</text>
  <g font-family="monospace" font-size="26" font-weight="700" letter-spacing="2" fill="#48545d">
    <text x="62" y="493">DEMO&lt;&lt;BLANK&lt;&lt;NOT&lt;&lt;VALID&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="62" y="526">SAMPLE&lt;&lt;DATA&lt;&lt;ONLY&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="62" y="559">KYC&lt;&lt;TEST&lt;&lt;TEMPLATE&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  </g>
  <g transform="rotate(-13 510 320)">
    <rect x="170" y="276" width="676" height="86" rx="13" fill="#ffffff" fill-opacity=".83" stroke="#b33d4b" stroke-width="3"/>
    <text x="508" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#b33d4b">DEMO • GEÇERSİZDİR</text>
    <text x="508" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b33d4b">NOT A GOVERNMENT DOCUMENT</text>
  </g>
  <text x="965" y="600" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#657984">SAMPLE ARTWORK ONLY</text>
</svg>