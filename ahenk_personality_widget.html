<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahenk Kişilik Aurası</title>
</head>
<body style="margin:0;background:#111214;">

<!--
  KULLANIM:
  ocean array'indeki value alanlarını backend'den gelen değerlerle değiştir (0-1 arası):
  ocean[0].value = kullanici.aciklik
  ocean[1].value = kullanici.ozdisiplin
  ocean[2].value = kullanici.disadonukluk
  ocean[3].value = kullanici.uyumluluk
  ocean[4].value = kullanici.denge
-->

<style>
*{box-sizing:border-box;margin:0;padding:0;}
#aw{width:100%;background:#111214;border-radius:12px;overflow:hidden;}
#top{position:relative;width:100%;height:290px;}
#ac{position:absolute;inset:0;width:100%;height:100%;display:block;}
#ar{position:absolute;top:10px;right:0;width:148px;display:flex;flex-direction:column;gap:4px;padding:0 8px;z-index:4;}
#arlabel{font-size:8px;color:#5a2030;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px;font-weight:600;}
.ai{background:rgba(50,8,18,0.6);border:1px solid rgba(107,26,42,0.22);border-left:3px solid transparent;border-radius:7px;padding:5px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;transition:background .2s,border-left-color .2s,box-shadow .2s;}
.ai:hover,.ai.on{background:rgba(107,26,42,0.42);border-left-color:#c0394f;box-shadow:inset 0 0 10px rgba(192,57,79,0.12);}
.ai-name{font-size:10px;font-weight:600;color:#d4a0aa;line-height:1.2;}
.ai-sub{font-size:8px;color:#6b3040;margin-top:1px;}
.ai-pct{font-size:10px;font-weight:700;color:#9b1e3a;flex-shrink:0;}
.ai.on .ai-pct{color:#e05070;}
#ahint{text-align:left;padding:8px 12px 3px;font-size:11px;color:#8a8a8a;transition:opacity .4s;}
#ahint.gone{opacity:0;pointer-events:none;visibility:hidden;}
#acard{background:rgba(40,6,14,0.93);border-top:1px solid rgba(155,30,58,0.2);border-radius:10px 10px 0 0;padding:9px 12px 13px;transition:opacity .3s,transform .3s;}
#acard.hidden{opacity:0;transform:translateY(5px);pointer-events:none;}
#acard-inner{display:flex;align-items:flex-start;gap:8px;}
#abar{width:2px;border-radius:2px;background:#c0394f;align-self:stretch;flex-shrink:0;min-height:22px;}
#act{font-size:11px;font-weight:700;color:#c0394f;letter-spacing:.03em;margin-bottom:3px;}
#acd{font-size:10px;color:#7a4050;line-height:1.55;}
</style>

<div id="aw">
  <div id="top">
    <canvas id="ac"></canvas>
    <div id="ar">
      <div id="arlabel">Kişilik Boyutları</div>
      <div class="ai" data-id="0"><div><div class="ai-name">Açıklık</div><div class="ai-sub">Yaratıcılık &amp; Deneyim</div></div><span class="ai-pct" id="pct-0">85%</span></div>
      <div class="ai" data-id="1"><div><div class="ai-name">Özdisiplin</div><div class="ai-sub">Hedef &amp; Düzen</div></div><span class="ai-pct" id="pct-1">65%</span></div>
      <div class="ai" data-id="2"><div><div class="ai-name">Dışadönüklük</div><div class="ai-sub">Sosyal Enerji</div></div><span class="ai-pct" id="pct-2">78%</span></div>
      <div class="ai" data-id="3"><div><div class="ai-name">Uyumluluk</div><div class="ai-sub">Empati &amp; İşbirliği</div></div><span class="ai-pct" id="pct-3">90%</span></div>
      <div class="ai" data-id="4"><div><div class="ai-name">Denge</div><div class="ai-sub">Duygusal Esneklik</div></div><span class="ai-pct" id="pct-4">55%</span></div>
    </div>
  </div>
  <div id="ahint">Kişilik frekansını keşfetmek için bir boyuta dokun.</div>
  <div id="acard" class="hidden">
    <div id="acard-inner">
      <div id="abar"></div>
      <div style="flex:1;min-width:0;">
        <p id="act">Kişilik Testi Notu</p>
        <p id="acd"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('ac');
  const ctx = canvas.getContext('2d');
  const top = document.getElementById('top');

  function resize(){canvas.width=top.offsetWidth||380;canvas.height=290;}
  resize();
  window.addEventListener('resize', resize);

  // =============================================
  // OCEAN VERİLERİ — backend'den gelen değerler
  // value: 0 ile 1 arasında (örn: %85 → 0.85)
  // =============================================
  const ocean = [
    { value: 0.85, levels: [
      "Yeni fikir ve deneyimlere karşı temkinlisin. Tanıdık ortamlar seni rahatlatıyor, belirsizlik ise zorlayabiliyor. Masalarda güvenli konularda güçlüsün.",
      "Merakın var ama seçici davranıyorsun. Bazı konularda derinleşmeyi seviyorsun, ancak her fikre kapı aralamıyorsun. Masalarda dengeli bir katkı sunuyorsun.",
      "Fikir ve deneyimlere tamamen açıksın. Masalarda entelektüel derinliği, sanatı ve sıra dışı bakış açılarını tetikleyen ana jeneratör sensin."
    ]},
    { value: 0.65, levels: [
      "Anlık kararlarla hareket etmeyi seviyorsun. Planlama yerine spontanlık seni tanımlıyor. Masalarda sürpriz enerji getiriyorsun ama tutarlılık zor olabiliyor.",
      "Belirli alanlarda düzenlisin, ancak esnekliğini de koruyorsun. Masalarda gerektiğinde organize olabilen, gerektiğinde akışa bırakabilen birisin.",
      "Hedef odaklı ve tutarlısın. Grup dinamiklerinde güven veren, masanın dengesini ve akışını koruyan sessiz organizatör sensin."
    ]},
    { value: 0.78, levels: [
      "Sosyal ortamlar seni yoruyor, yalnız zaman enerji veriyor. Masalarda derin bire bir bağlantılarda parıldassan da kalabalık dinamikler zorlayabiliyor.",
      "Ne tam içedönük ne tam dışadönüksün — ortam ve insanlara göre değişiyorsun. Masalarda seçici ama kaliteli bir enerji yayıyorsun.",
      "Sosyal ortamlardan enerji alıyorsun. Masaya oturduğun andan itibaren buzları eriten, konuşmaları başlatan ve ortamı ısıtan birisin."
    ]},
    { value: 0.90, levels: [
      "Kendi bakış açın güçlü ve bunu kolayca bırakmıyorsun. Masalarda tartışmayı canlandırıyorsun ancak ortak zemin bulmak zaman alıyor.",
      "İşbirliğine açıksın ama sınırların da var. Masalarda hem kendi sesini duyurabiliyorsun hem de diğerlerini dinleyebiliyorsun.",
      "Empatik frekansın çok yüksek. İnsanları dinleme ve ortak paydada buluşturma yeteneğinle dahil olduğun her masada derin bir konfor alanı yaratıyorsun."
    ]},
    { value: 0.55, levels: [
      "Duygular seni güçlü etkiliyor ve bunu çevrene yansıtıyorsun. Masalarda yoğun anlarda dengeyi korumak zorlaşabiliyor, ama bu aynı zamanda özgünlüğünün bir parçası.",
      "Duygusal esnekliğin gelişiyor. Çoğu durumda sakin kalabiliyorsun, ancak beklenmedik anlarda zaman zaman sendeleyebiliyorsun.",
      "Duygusal zemin sağlam. Hararetli tartışmalarda bile sakin kalabiliyor, masadaki en dengeli ve rasyonel frekansı sen yayıyorsun."
    ]},
  ];

  // Yüzdeleri listede göster
  ocean.forEach((o, i) => {
    const el = document.getElementById('pct-' + i);
    if(el) el.textContent = Math.round(o.value * 100) + '%';
  });

  // =============================================
  // KÜRE RENK PALETLERİ (her boyut için)
  // =============================================
  const PALETTES = [
    // 0 Açıklık — mor/indigo
    [{i:{r:30,g:10,b:80}, m:{r:80,g:30,b:160},  o:{r:140,g:80,b:220}, a:0.34},
     {i:{r:20,g:5,b:60},  m:{r:60,g:20,b:130},  o:{r:120,g:60,b:200}, a:0.27},
     {i:{r:40,g:15,b:90}, m:{r:90,g:40,b:170},  o:{r:150,g:90,b:230}, a:0.20},
     {i:{r:15,g:5,b:50},  m:{r:50,g:15,b:110},  o:{r:100,g:50,b:180}, a:0.17},
     {i:{r:25,g:8,b:70},  m:{r:70,g:25,b:140},  o:{r:130,g:70,b:210}, a:0.13}],
    // 1 Özdisiplin — lacivert/zümrüt
    [{i:{r:5,g:20,b:50},  m:{r:10,g:70,b:100},  o:{r:20,g:130,b:160}, a:0.34},
     {i:{r:3,g:15,b:40},  m:{r:8,g:55,b:85},    o:{r:15,g:110,b:140}, a:0.27},
     {i:{r:5,g:30,b:60},  m:{r:10,g:80,b:110},  o:{r:20,g:140,b:170}, a:0.20},
     {i:{r:2,g:10,b:35},  m:{r:6,g:45,b:75},    o:{r:12,g:95,b:125},  a:0.17},
     {i:{r:4,g:22,b:48},  m:{r:9,g:62,b:92},    o:{r:18,g:120,b:150}, a:0.13}],
    // 2 Dışadönüklük — turuncu/altın
    [{i:{r:80,g:20,b:5},  m:{r:160,g:60,b:10},  o:{r:220,g:120,b:30}, a:0.34},
     {i:{r:60,g:15,b:3},  m:{r:130,g:45,b:8},   o:{r:190,g:95,b:20},  a:0.27},
     {i:{r:90,g:25,b:6},  m:{r:170,g:70,b:12},  o:{r:230,g:135,b:35}, a:0.20},
     {i:{r:50,g:12,b:2},  m:{r:110,g:35,b:6},   o:{r:170,g:80,b:15},  a:0.17},
     {i:{r:70,g:18,b:4},  m:{r:145,g:52,b:9},   o:{r:205,g:108,b:25}, a:0.13}],
    // 3 Uyumluluk — mint/turkuaz
    [{i:{r:5,g:50,b:45},  m:{r:10,g:130,b:120}, o:{r:30,g:200,b:185}, a:0.34},
     {i:{r:3,g:38,b:34},  m:{r:8,g:108,b:100},  o:{r:22,g:175,b:162}, a:0.27},
     {i:{r:6,g:58,b:52},  m:{r:12,g:145,b:135}, o:{r:35,g:210,b:195}, a:0.20},
     {i:{r:2,g:30,b:27},  m:{r:6,g:90,b:84},    o:{r:18,g:155,b:143}, a:0.17},
     {i:{r:4,g:44,b:40},  m:{r:10,g:118,b:110}, o:{r:27,g:188,b:174}, a:0.13}],
    // 4 Denge — gök mavisi
    [{i:{r:8,g:20,b:70},  m:{r:20,g:55,b:160},  o:{r:60,g:110,b:230}, a:0.34},
     {i:{r:5,g:15,b:55},  m:{r:15,g:42,b:135},  o:{r:45,g:88,b:200},  a:0.27},
     {i:{r:9,g:24,b:80},  m:{r:22,g:62,b:175},  o:{r:68,g:120,b:240}, a:0.20},
     {i:{r:4,g:12,b:48},  m:{r:12,g:35,b:118},  o:{r:38,g:75,b:180},  a:0.17},
     {i:{r:6,g:18,b:62},  m:{r:17,g:48,b:148},  o:{r:52,g:98,b:215},  a:0.13}],
  ];

  const GLOWS = [
    {r:124,g:58,b:237},  // Açıklık
    {r:8,g:145,b:178},   // Özdisiplin
    {r:249,g:115,b:22},  // Dışadönüklük
    {r:45,g:212,b:191},  // Uyumluluk
    {r:96,g:165,b:250},  // Denge
  ];

  function lerp(a,b,t){return{r:Math.round(a.r+(b.r-a.r)*t),g:Math.round(a.g+(b.g-a.g)*t),b:Math.round(a.b+(b.b-a.b)*t)};}
  function rgb(c){return`rgb(${c.r},${c.g},${c.b})`;}

  const curLayers = PALETTES[3].map(l=>({i:{...l.i},m:{...l.m},o:{...l.o},a:l.a}));
  let curGlow = {...GLOWS[3]};
  let activeId = 3, turbulence = 0.15, time = 0, hintGone = false;

  function getLevel(v){return v<0.4?0:v<0.7?1:2;}

  function initActive(id){
    activeId = id;
    document.querySelectorAll('.ai').forEach(el=>el.classList.toggle('on',parseInt(el.dataset.id)===id));
    document.getElementById('acd').textContent = ocean[id].levels[getLevel(ocean[id].value)];
    document.getElementById('acard').classList.remove('hidden');
  }

  function setActive(id){
    if(!hintGone){hintGone=true;document.getElementById('ahint').classList.add('gone');}
    activeId = id; turbulence = 1.1;
    document.querySelectorAll('.ai').forEach(el=>el.classList.toggle('on',parseInt(el.dataset.id)===id));
    const card = document.getElementById('acard');
    card.classList.add('hidden');
    setTimeout(()=>{
      document.getElementById('acd').textContent = ocean[id].levels[getLevel(ocean[id].value)];
      card.classList.remove('hidden');
    }, 200);
  }

  document.querySelectorAll('.ai').forEach(el=>{
    el.addEventListener('mouseenter', ()=>setActive(parseInt(el.dataset.id)));
    el.addEventListener('touchstart', e=>{e.preventDefault();setActive(parseInt(el.dataset.id));},{passive:false});
  });

  initActive(3);

  function draw(){
    const W=canvas.width, H=canvas.height;
    ctx.clearRect(0,0,W,H);
    time += 0.011;
    turbulence += (0.13 - turbulence) * 0.05;

    curGlow = lerp(curGlow, GLOWS[activeId], 0.04);
    PALETTES[activeId].forEach((tl,li)=>{
      curLayers[li].i = lerp(curLayers[li].i, tl.i, 0.04);
      curLayers[li].m = lerp(curLayers[li].m, tl.m, 0.04);
      curLayers[li].o = lerp(curLayers[li].o, tl.o, 0.04);
    });

    const cx=W*0.25, cy=H*0.5, baseR=88;

    curLayers.forEach((layer,li)=>{
      const spd=0.7+li*0.15, shrink=li*10;
      const pts=[];
      for(let i=0;i<=200;i++){
        const ang=(i/200)*Math.PI*2;
        let n=Math.sin(ang*3+time*spd+li*0.8)*16*ocean[0].value;
        n+=Math.cos(ang*5-time*0.75*spd+li*0.5)*11*ocean[2].value;
        n+=Math.sin(ang*2+time*1.2*spd)*19*ocean[3].value;
        n+=Math.cos(ang*7+time*0.55*spd+li)*5*ocean[1].value;
        n+=Math.sin(ang*4-time*spd)*8*ocean[4].value;
        const aAng=(activeId/5)*Math.PI*2-Math.PI/2;
        const diff=Math.min(Math.abs(ang-aAng),Math.PI*2-Math.abs(ang-aAng));
        if(diff<1.3) n*=(1+turbulence*(2.4+li*0.3));
        const r=baseR-shrink+n*turbulence*(3.5+li*0.4);
        pts.push({x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r});
      }
      ctx.shadowBlur = li===0?30:0;
      ctx.shadowColor = `rgba(${curGlow.r},${curGlow.g},${curGlow.b},0.55)`;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=0;i<pts.length-1;i++){
        const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
        ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
      }
      ctx.closePath();
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,(baseR-shrink)*1.5);
      g.addColorStop(0, rgb(layer.i));
      g.addColorStop(0.45, rgb(layer.m));
      g.addColorStop(0.82, rgb(layer.o));
      g.addColorStop(1, 'rgba(17,18,20,0)');
      ctx.fillStyle=g; ctx.globalAlpha=layer.a; ctx.fill();
    });

    ctx.shadowBlur=0;
    const core=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*0.32);
    core.addColorStop(0, `rgba(${curGlow.r},${curGlow.g},${curGlow.b},0.3)`);
    core.addColorStop(0.5, `rgba(${curGlow.r},${curGlow.g},${curGlow.b},0.1)`);
    core.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha=1; ctx.fillStyle=core;
    ctx.beginPath(); ctx.arc(cx,cy,baseR*0.32,0,Math.PI*2); ctx.fill();

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>
